<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64px" height="64px" viewBox="0 0 64 64" version="1.1">
  <!-- hull skin, cut away in the middle to show the bulkhead behind it -->
  <path style="fill:#a05a2c;stroke:#1a1a1a;stroke-width:2.67"
        d="M 2,61 14,61 14,9 50,9 50,61 62,61 62,63 2,63 Z"/>
  <!-- the bulkhead wall, spanning the section -->
  <path style="fill:#8b634a;stroke:#000;stroke-width:2"
        d="M 30,9 34,9 34,61 30,61 Z"/>
  <!-- flange bands running along the skin, either side of the wall -->
  <path style="fill:#b79179;stroke:#000;stroke-width:1.6"
        d="M 14,9 30,9 30,15 14,15 Z M 34,9 50,9 50,15 34,15 Z"/>
</svg>
